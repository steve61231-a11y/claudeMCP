services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: political_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Web-discovery metasearch: one query fanned across 200+ engines, returning
  # JSON. This is what reaches archived/obscure pages the fixed connectors never
  # index. Keyless and self-hosted, so discovery costs nothing per query.
  searxng:
    image: searxng/searxng:latest
    environment:
      # JSON output is off by default upstream; the engine needs it.
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      BASE_URL: http://localhost:8080/
    volumes:
      - ./deploy/searxng:/etc/searxng:ro
    ports:
      - "8080:8080"

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/political_intel
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      SOCIALCRAWL_API_KEY: ${SOCIALCRAWL_API_KEY:-}
      APP_ENV: ${APP_ENV:-local-dev}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/political_intel
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ENGINE_URL: http://engine:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      APP_ENV: ${APP_ENV:-local-dev}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - neo4j
      - engine

volumes:
  postgres_data:
  neo4j_data:
