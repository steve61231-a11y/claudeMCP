# Local development: the same image the host runs (engine/Dockerfile.render →
# engine/start.sh → engine.api_server:app, which also serves the page), with a
# Postgres and SearXNG beside it. `docker compose up`, then open
# http://localhost:8000.
#
# This used to start a different app — engine/main.py behind a NestJS gateway,
# with Neo4j — that no deployment ever ran, so "it works locally" said nothing
# about production. Both were deleted on 22 Oct 2026.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: political_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Web-discovery metasearch: one query fanned across 200+ engines, returning
  # JSON. This is what reaches archived/obscure pages the fixed connectors never
  # index. Keyless and self-hosted, so discovery costs nothing per query.
  searxng:
    # Same image as production (settings with the JSON API enabled are baked in),
    # so local behaviour matches the deploy.
    build:
      context: .
      dockerfile: ./deploy/searxng/Dockerfile
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: local-dev-secret
    ports:
      - "8080:8080"

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile.render
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/political_intel
      APP_ENV: ${APP_ENV:-local-dev}
      SEARXNG_URL: http://searxng:8080
      # The model backend and paid sources, from your shell or a .env file.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BULK_MODEL: ${LLM_BULK_MODEL:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      SOCIALCRAWL_API_KEY: ${SOCIALCRAWL_API_KEY:-}
      PULSE_API_KEY: ${PULSE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - searxng

volumes:
  postgres_data:
