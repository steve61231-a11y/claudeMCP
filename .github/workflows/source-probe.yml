name: source-probe

# Which free sources a CLOUD server can reach, and through which door.
#
# The engine's development sandbox has no route to kenyalaw.org or
# reddit.com, so every fix for a refused source used to be written blind and
# tested for the first time on a client's report. GitHub's runners sit on a
# datacenter network like the production container's, so this answers the
# question from the right side of the wall — plain requests vs. a Chrome TLS
# fingerprint, per endpoint — as annotations on the run. No secrets.

on:
  push:
    branches:
      - claude/magical-mayer-yzxz5s
      - main
    paths:
      - "engine/ingestion/**"
      - "engine/evidence/search_sources.py"
      - "scripts/source_probe.py"
      - ".github/workflows/source-probe.yml"
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the two HTTP clients the engine uses
        run: pip install requests curl_cffi==0.16.2 pypdf==5.1.0
      - name: Probe each source
        run: python scripts/source_probe.py
      # The Issue Map's record connectors, run for real on public topics
      # (scripts/record_probe.py) — a connector is never declared working
      # on a fake alone.
      - name: Install what the record connectors import
        # The engine's requirements without the heavy NLP and scraping
        # stacks, which nothing in the record connectors imports.
        run: grep -vE "^(spacy|hdbscan|scikit-learn|scrapling|yt-dlp|trafilatura|sentence-transformers)" engine/requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt python-dotenv
      - name: Run the record connectors
        run: PYTHONPATH=. python scripts/record_probe.py
