name: db-backup

# Independent safety net for the database. Runs entirely on GitHub's own
# infrastructure — it does not touch Render and does not need Claude Code to
# be running. If the Render subscription lapses, this keeps producing daily
# database snapshots anyway; if the Claude Code subscription lapses, this
# keeps running anyway, because nothing about it depends on either.
#
# Requires one repository secret: DATABASE_URL (the same Postgres connection
# string used in the Render dashboard — currently a Neon connection string).
# Set it at: Settings -> Secrets and variables -> Actions -> New repository
# secret. Never paste the connection string into a chat, an issue, or a PR.

on:
  schedule:
    - cron: "17 3 * * *"   # once a day, off the hour to avoid the herd
  workflow_dispatch: {}     # allow manual runs from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secret is set
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret is not set — see the comment at the top of this workflow."
            exit 1
          fi

      - name: Install a matching Postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16 \
            || sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backup
          stamp=$(date -u +%Y%m%d-%H%M%S)
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            --file="backup/db-${stamp}.dump"
          echo "STAMP=${stamp}" >> "$GITHUB_ENV"
          ls -la backup/

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: backup/db-${{ env.STAMP }}.dump
          retention-days: 90
