name: db-backup

# Independent safety net for the database. Runs entirely on GitHub's own
# infrastructure — it does not touch Render and does not need Claude Code to
# be running. If the Render subscription lapses, this keeps producing daily
# database snapshots anyway; if the Claude Code subscription lapses, this
# keeps running anyway, because nothing about it depends on either.
#
# Requires one repository secret: DATABASE_URL.
#
# It must be the database's EXTERNAL connection string, NOT the one in the
# pulse-engine service's environment. The app runs inside Render, so its
# DATABASE_URL uses an internal hostname (`dpg-xxxxx-a`, no domain suffix)
# that only resolves inside Render's own network — GitHub cannot reach it.
# Get the external one from: Render dashboard -> the pulse-postgres database
# -> Connect -> External Connection. It looks like
# `dpg-xxxxx-a.<region>-postgres.render.com`.
#
# Set it at: Settings -> Secrets and variables -> Actions -> New repository
# secret. Never paste the connection string into a chat, an issue, or a PR.

on:
  schedule:
    - cron: "17 3 * * *"   # once a day, off the hour to avoid the herd
  workflow_dispatch: {}     # allow manual runs from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    # The alarm below opens and closes an issue. The default token is
    # read-only on repositories configured that way, and a workflow that
    # cannot raise the alarm fails silently in a NEW way, which is the bug
    # it exists to fix.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check the secret is set, and is one GitHub can actually reach
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — see the comment at the top of this workflow."
            exit 1
          fi
          # The failure this workflow actually had, thirty nights running.
          #
          # A Render INTERNAL host is `dpg-xxxxx-a` with no dots — it resolves
          # only inside Render's network, so pg_dump here fails with "could
          # not translate host name" every time. The step above passed (the
          # secret WAS set), the dump step failed, and nothing distinguished
          # "wrong hostname" from "database down" from "credentials expired".
          # Name it, so the next person loses minutes rather than months.
          host=$(printf '%s' "$DATABASE_URL" | sed -E 's#^[a-z+]+://[^@]*@##; s#[:/?].*$##')
          echo "host: $host"
          case "$host" in
            *.*) : ;;   # a real domain — Neon, Supabase, Render external, anything
            "")  echo "::error::Could not read a hostname out of DATABASE_URL."; exit 1 ;;
            *)   echo "::error::DATABASE_URL points at '$host', which has no domain — that is a Render INTERNAL hostname and only resolves inside Render's own network. GitHub can never reach it, so this backup can never run. Use the EXTERNAL connection string (Render dashboard -> pulse-postgres -> Connect -> External Connection), or any ordinary host such as Neon or Supabase."
                 exit 1 ;;
          esac

      # pg_dump refuses to dump a server NEWER than itself, and this is exactly
      # how the first manual backup attempt failed (server 18.6, client 17.11).
      # Ubuntu's default archive lags, so pull the client from Postgres's own
      # PGDG repo and take the newest available.
      - name: Install a Postgres client new enough for the server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-18 \
            || sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backup
          stamp=$(date -u +%Y%m%d-%H%M%S)
          # Capture pg_dump's own words rather than letting them die in a log
          # body. GitHub serves raw logs from blob storage, so the reason a
          # backup failed was unreadable from anywhere except a browser — and
          # "exit code 1" in the annotation is the same non-answer for a wrong
          # hostname, a deleted database and a rotated password.
          # "SSL connection has been closed unexpectedly" is the server
          # hanging up during the handshake, not a bad address — the host
          # resolved and the TCP connection landed. It can mean the database
          # is suspended, but it can also mean a TLS negotiation the client
          # and server cannot agree on, so try the explicit modes before
          # concluding the data is gone. Costs seconds; the alternative is
          # writing off a corpus that is still there.
          # verify-full is not in this list: it needs a CA bundle at
          # ~/.postgresql/root.crt, so it always fails here for a reason that
          # has nothing to do with the database — and being last, its error
          # was the one reported, hiding what the real modes said.
          dumped=""; attempts=""
          for mode in "" "?sslmode=require" "?sslmode=prefer" "?sslmode=disable"; do
            url="$DATABASE_URL"
            case "$url" in *\?*) [ -n "$mode" ] && url="${url}&${mode#\?}" ;;
                           *)     url="${url}${mode}" ;; esac
            echo "trying: ${mode:-<as supplied>}"
            if err=$(pg_dump "$url" --format=custom --no-owner \
                       --no-privileges --file="backup/db-${stamp}.dump" 2>&1); then
              dumped="yes"; echo "  -> connected"; break
            fi
            echo "  -> ${err}"
            # Accumulate with a printf rather than a literal newline inside
            # the string: a continuation line indented less than this block
            # scalar ends it, and the rest of the file is then parsed as
            # YAML — which is how this workflow stopped having a
            # workflow_dispatch trigger at all.
            # One line, separated by " | ". A `::error::` annotation is
            # truncated at its first newline, so a multi-line summary of the
            # attempts rendered as an empty message — the detail was there
            # and unreadable, which is the whole failure mode again.
            attempts="${attempts} | ${mode:-as-supplied}: ${err}"
          done
          if [ -z "$dumped" ]; then
            echo "::error::pg_dump could not connect under any TLS mode:${attempts}"
            {
              echo "### The database could not be dumped"
              echo
              echo '```'
              echo "${attempts}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "STAMP=${stamp}" >> "$GITHUB_ENV"
          ls -la backup/

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: backup/db-${{ env.STAMP }}.dump
          retention-days: 90

      # A backup that failed must never look like a backup that ran.
      #
      # This job failed every night from the day it was written and nobody
      # knew, because a red tick in a tab nobody opens is not a signal. The
      # product this repo builds is founded on exactly that rule — an empty
      # section must not look like a section with nothing to say — and the
      # backup protecting it was breaking the same rule for a month.
      #
      # So: say so somewhere that gets read. One open issue, reused rather
      # than piling up a new one every night, closed automatically the first
      # time a dump succeeds.
      - name: Say so, loudly, if the dump did not happen
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Database backup is failing — there is no usable dump"
          # --repo is not optional here: this job never checks the code out,
          # so gh has no repository to infer, and every call failed. The alarm
          # that exists so failures are not silent was failing silently.
          existing=$(gh issue list --repo "$GH_REPO" --state open \
                     --search "$title in:title" \
                     --json number --jq '.[0].number' 2>/dev/null || true)
          body=$(printf '%s\n' \
            "The nightly \`db-backup\` job failed: $RUN_URL" \
            "" \
            "**Until this is green there is no database backup at all.** The" \
            "code in this repository is safe on GitHub; the corpus is not" \
            "reproducible from it, so this is the only thing standing between" \
            "a hosting problem and losing every run ever collected." \
            "" \
            "Most likely causes, in order:" \
            "1. \`DATABASE_URL\` is an internal hostname the runner cannot resolve." \
            "2. The database is gone, suspended, or its password was rotated." \
            "3. The server is newer than the client (see the install step)." \
            "" \
            "This issue is reused, not duplicated, and closes itself on the" \
            "first successful dump.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "$body"
          fi

      - name: Close the alarm once a dump has actually been taken
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Database backup is failing — there is no usable dump"
          for n in $(gh issue list --repo "$GH_REPO" --state open \
                     --search "$title in:title" \
                     --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$n" --repo "$GH_REPO" --comment "A dump succeeded — closing."
          done
