name: period-probe

# Can a long report period be collected in full, or only its last weeks?
# Generic public query; counts and months only. Run on demand.

on:
  workflow_dispatch: {}
  push:
    paths:
      - scripts/period_probe.py
      - .github/workflows/period-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/period_probe.py
