databases:
  - name: pulse-postgres
    plan: free
    databaseName: political_intel
    user: pulse

services:
  - type: web
    name: pulse-engine
    runtime: docker
    plan: standard
    dockerfilePath: ./engine/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # DATABASE_URL is set in the Render dashboard to the managed Neon Postgres
      # (serverless, no 90-day expiry). The old pulse-postgres block below is kept
      # only as a rollback safety net and is no longer wired to the app.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SOCIALCRAWL_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: PULSE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # TEMPORARY (Anthropic credits are depleted): serve the full pre-generated
      # report instantly for matched names (e.g. "John Mbadi") with ZERO LLM
      # spend, so the working product is demoable while credits are topped up.
      # Set back to "false" once Anthropic credit is added to run live for any name.
      - key: SERVE_PRECACHE_FIRST
        value: "true"
      # Full-power pipeline (2GB): full concurrency, all sources, no per-run caps.
      - key: LOW_MEMORY
        value: "false"
      # Web-discovery metasearch instance (the searxng service below). Internal
      # URL — Render services reach each other privately, no public exposure.
      # Leave unset to disable discovery entirely.
      - key: SEARXNG_URL
        sync: false
      - key: ENABLE_DISCOVERY
        value: "true"
      - key: INGESTION_REFRESH_HOURS
        value: "6"
      - key: SCHEDULED_CREDIT_BUDGET
        value: "200"
      # Hot subjects kept continuously fresh by the 6h scheduler. Edit freely.
      - key: PREWARM_NAMES
        value: "William Ruto,Rigathi Gachagua,Raila Odinga,John Mbadi,Edwin Sifuna"
      # Free X backend (browserless). Set X_USERNAME/X_EMAIL/X_PASSWORD as
      # secrets in the dashboard to activate real X scraping.
      - key: ENABLE_TWSCRAPE
        value: "true"
      - key: X_USERNAME
        sync: false
      - key: X_EMAIL
        sync: false
      - key: X_PASSWORD
        sync: false

  # Web-discovery metasearch: fans one query across 200+ engines and returns
  # JSON. Self-hosted so exhaustive discovery costs nothing per query. Only the
  # engine talks to it, over Render's private network.
  # Built from deploy/searxng/Dockerfile rather than the stock image: our
  # settings.yml (which turns the JSON API on) has to be baked in, since a
  # hosted image deploy cannot mount local files.
  - type: web
    name: zenith-searxng
    runtime: docker
    plan: starter
    dockerfilePath: ./deploy/searxng/Dockerfile
    dockerContext: ./deploy/searxng
    healthCheckPath: /healthz
    envVars:
      - key: SEARXNG_BASE_URL
        value: "http://zenith-searxng:8080/"
      - key: SEARXNG_SECRET
        generateValue: true
