databases:
  - name: pulse-postgres
    plan: free
    databaseName: political_intel
    user: pulse

services:
  - type: web
    name: pulse-engine
    runtime: docker
    plan: free
    dockerfilePath: ./engine/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # DATABASE_URL now points to a managed serverless Postgres (Neon) set as a
      # dashboard secret — more reliable + no 90-day expiry than the free Render
      # PG. IMPORTANT: set this in the Render dashboard BEFORE redeploying, or
      # startup (alembic upgrade) can't connect. The pulse-postgres block below
      # is kept as a rollback fallback (unused while DATABASE_URL is set).
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SOCIALCRAWL_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: PULSE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # DEMO MODE: serve the full pre-generated report instantly for matched
      # names (e.g. "Mbadi"/"John Mbadi") — no live pipeline, zero LLM credits,
      # works despite the 512MB RAM limit. Set to "false" after upgrading RAM to
      # run genuinely live reports for any subject.
      - key: SERVE_PRECACHE_FIRST
        value: "true"
      - key: INGESTION_REFRESH_HOURS
        value: "6"
      - key: SCHEDULED_CREDIT_BUDGET
        value: "200"
      # Hot subjects kept continuously fresh by the 6h scheduler. Edit freely.
      - key: PREWARM_NAMES
        value: "William Ruto,Rigathi Gachagua,Raila Odinga,John Mbadi,Edwin Sifuna"
      # Free X backend (browserless). Set X_USERNAME/X_EMAIL/X_PASSWORD as
      # secrets in the dashboard to activate real X scraping.
      - key: ENABLE_TWSCRAPE
        value: "true"
      - key: X_USERNAME
        sync: false
      - key: X_EMAIL
        sync: false
      - key: X_PASSWORD
        sync: false
