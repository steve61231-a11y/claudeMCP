databases:
  - name: pulse-postgres
    plan: free
    databaseName: political_intel
    user: pulse

services:
  - type: web
    name: pulse-engine
    runtime: docker
    plan: free
    dockerfilePath: ./engine/Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SOCIALCRAWL_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: PULSE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: INGESTION_REFRESH_HOURS
        value: "6"
      - key: SCHEDULED_CREDIT_BUDGET
        value: "200"
      # Hot subjects kept continuously fresh by the 6h scheduler. Edit freely.
      - key: PREWARM_NAMES
        value: "William Ruto,Rigathi Gachagua,Raila Odinga,John Mbadi,Edwin Sifuna"
      # Free X backend (browserless). Set X_USERNAME/X_EMAIL/X_PASSWORD as
      # secrets in the dashboard to activate real X scraping.
      - key: ENABLE_TWSCRAPE
        value: "true"
      - key: X_USERNAME
        sync: false
      - key: X_EMAIL
        sync: false
      - key: X_PASSWORD
        sync: false
